services:
  faultline:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FAULTLINE_ADMIN_TOKEN: ${FAULTLINE_ADMIN_TOKEN:?Set FAULTLINE_ADMIN_TOKEN before starting Faultline}
      FAULTLINE_DATA_FILE: /data/faultline.json
    volumes:
      - faultline-data:/data

volumes:
  faultline-data:
