name: Bug report
description: Report reproducible incorrect behaviour in Faultline
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Faultline issue. Please remove credentials, customer data, private network information, and other sensitive material before submitting.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Live Diagnostics
        - Network Bisect
        - Flight Recorder
        - Hosted Demo
        - Analyst
        - Topology
        - Cases / evidence
        - API / SDK
        - Packaging / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Commit SHA, release/version, or approximate date if unknown
      placeholder: e.g. main @ abc1234
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser, deployment type, or other relevant runtime details
      placeholder: e.g. Windows 11, Node 22, local runtime
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behaviour and why it appears incorrect
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that reproduces the problem
      placeholder: |
        1. Start Faultline with ...
        2. Open ...
        3. Run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Relevant output or evidence
      description: Paste redacted logs, diagnostic output, screenshots, or stack traces. Do not include secrets or private customer information.
      render: shell

  - type: checkboxes
    id: safety
    attributes:
      label: Submission checks
      options:
        - label: I have removed credentials, tokens, customer data, and unnecessary private network information.
          required: true
        - label: I have searched existing issues for the same problem.
          required: true
        - label: I am reporting a normal bug, not a security vulnerability. Security issues should follow SECURITY.md.
          required: true
